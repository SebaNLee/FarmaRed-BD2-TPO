name: farmared

services:
  mongo:
    image: mongo:9.0.2
    container_name: farmared-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - farmared-net

  cassandra:
    image: cassandra:5.0.9
    container_name: farmared-cassandra
    restart: unless-stopped
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: farmared
      CASSANDRA_DC: datacenter1
      CASSANDRA_RACK: rack1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      CASSANDRA_NUM_TOKENS: "1"
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 100M
    volumes:
      - cassandra-data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "nodetool status | grep -E '^UN' > /dev/null"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 90s
    networks:
      - farmared-net

volumes:
  mongo-data:
  cassandra-data:

networks:
  farmared-net:
    driver: bridge
